name = "sdl-space-v1"
main = "./worker/index.ts"
compatibility_date = "2026-07-07"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "sdl.space"
custom_domain = true

[[routes]]
pattern = "www.sdl.space"
custom_domain = true

[observability]
enabled = true
